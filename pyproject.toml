[project]
name = "irodori-voice-reader"
version = "1.0.0"
description = "Local Irodori-TTS V4.1 Anime web reader with a Chrome extension"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "huggingface-hub>=0.34.0",
    "irodori-tts @ git+https://github.com/Aratako/Irodori-TTS.git",
    "miniaudio>=1.59",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "soundfile>=0.13.1",
    "torch>=2.10.0,<2.11.0",
    "torchaudio>=2.10.0,<2.11.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.10.0,<2.11.0",
    "torchao>=0.16.0,<0.17.0",
    "torchaudio>=2.10.0,<2.11.0",
]
cu128 = [
    "torch>=2.10.0,<2.11.0",
    "torchao>=0.16.0,<0.17.0",
    "torchaudio>=2.10.0,<2.11.0",
]
rocm = [
    "torch>=2.10.0,<2.11.0; sys_platform == 'linux'",
    "torch[device-gfx1100]==2.10.0+rocm7.14.0; sys_platform == 'win32'",
    "rocm[libraries]==7.14.0; sys_platform == 'win32'",
    "rocm-bootstrap; sys_platform == 'win32'",
    "rocm-sdk-core==7.14.0; sys_platform == 'win32'",
    "rocm-sdk-libraries==7.14.0; sys_platform == 'win32'",
    "rocm-sdk-device-gfx1100==7.14.0; sys_platform == 'win32'",
    "rocm-sdk-device-gfx1103==7.14.0; sys_platform == 'win32'",
    "amd-torch-device-gfx1100==2.10.0+rocm7.14.0; sys_platform == 'win32'",
    "amd-torch-device-gfx1103==2.10.0+rocm7.14.0; sys_platform == 'win32'",
    "amd-torch-device-gfx11==2.10.0+rocm7.14.0; sys_platform == 'win32'",
    "torchao>=0.16.0,<0.17.0",
    "torchaudio>=2.10.0,<2.11.0; sys_platform == 'linux'",
    "torchaudio==2.10.0+rocm7.14.0; sys_platform == 'win32'",
    "pytorch-triton-rocm>=3.5.1; sys_platform == 'linux'",
    "triton-rocm>=3.6.0; sys_platform == 'linux'",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
        { extra = "rocm" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
    { index = "pytorch-rocm-win", extra = "rocm", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
    { index = "pytorch-rocm-win", extra = "rocm", marker = "sys_platform == 'win32'" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
rocm = { index = "pytorch-rocm-win" }
rocm-bootstrap = { index = "pytorch-rocm-win" }
rocm-sdk-core = { index = "pytorch-rocm-win" }
rocm-sdk-libraries = { index = "pytorch-rocm-win" }
rocm-sdk-device-gfx1100 = { index = "pytorch-rocm-win" }
rocm-sdk-device-gfx1103 = { index = "pytorch-rocm-win" }
amd-torch-device-gfx1100 = { index = "pytorch-rocm-win" }
amd-torch-device-gfx1103 = { index = "pytorch-rocm-win" }
amd-torch-device-gfx11 = { index = "pytorch-rocm-win" }

# 公開 sdist の PKG-INFO が rocm 自身を依存に含み、libraries extra を解決できない。
# Linux 用 wheel の依存（triton）が Windows 解決に混ざるので、Windows wheel の依存に固定する。
[[tool.uv.dependency-metadata]]
name = "torch"
version = "2.10.0+rocm7.14.0"
requires-dist = [
    "filelock",
    "typing-extensions>=4.10.0",
    "setuptools; python_version >= \"3.12\"",
    "sympy>=1.13.3",
    "networkx>=2.5.1",
    "jinja2",
    "fsspec>=0.8.5",
    "rocm[libraries]==7.14.0",
    "rocm-bootstrap",
    "amd-torch-device-gfx1100==2.10.0+rocm7.14.0; extra == \"device-gfx1100\"",
    "amd-torch-device-gfx11==2.10.0+rocm7.14.0; extra == \"device-gfx1100\"",
]
provides-extra = ["device-gfx1100"]

[[tool.uv.dependency-metadata]]
name = "rocm"
version = "7.14.0"
requires-dist = [
    "rocm-sdk-core==7.14.0",
    "rocm-sdk-libraries==7.14.0; extra == \"libraries\"",
]
provides-extra = ["libraries"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true

# Windows ネイティブ ROCm。RX 7900 XTX (gfx1100) と Radeon 780M (gfx1103)。
# インデックスは欠けるパッケージに 403 を返すので explicit にする。
[[tool.uv.index]]
name = "pytorch-rocm-win"
url = "https://repo.amd.com/rocm/whl-multi-arch/"
explicit = true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]
